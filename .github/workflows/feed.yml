# Workflow for the public feed repository (copy to .github/workflows/feed.yml there).
#
# It lives in the public repo, not in mission-tracker, because Actions minutes are free for
# public repositories; a run every 15 minutes would exceed the private-repo allowance.
#
# Branches in the feed repo:
#   gh-pages  feed.json + state/, replaced by a single commit each run (no history growth);
#             served by GitHub Pages as https://<owner>.github.io/<repo>/feed.json
#   main      this workflow, README, and history/<year>-W<week>.json weekly snapshots
#
# Secret: MISSION_TRACKER_DEPLOY_KEY, the private half of a read-only deploy key on the private
# mission-tracker repository (to check out feedgen). FEEDGEN_REF picks the branch to run.
name: feed

# Every run starts the next one (job `next`): GitHub never ran this repo's schedule (Nov 2026), so
# the schedule stays only as a backstop that restarts the chain if it breaks. Start the chain by
# hand with "Run workflow" if the feed stops updating.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 min, off the busy :00/:15/:30/:45 marks
  workflow_dispatch:

permissions:
  contents: write

env:
  FEEDGEN_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: feed-build
      cancel-in-progress: false
    steps:
      - name: Check out feedgen
        uses: actions/checkout@v4
        with:
          repository: carmelovarela/mission-tracker
          ref: ${{ env.FEEDGEN_REF }}
          ssh-key: ${{ secrets.MISSION_TRACKER_DEPLOY_KEY }}
          path: src
          sparse-checkout: |
            feedgen
            mission-trackerTests/Fixtures
            mission-tracker/Resources/Fixtures

      - name: Check out the published feed
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
        continue-on-error: true   # first run: the branch doesn't exist yet

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test feedgen
        working-directory: src
        run: python -m unittest discover -s feedgen/tests -t .

      - name: Build the feed
        run: |
          mkdir -p site
          cd src && python -m feedgen --out ../site/feed.json --state ../site/state

      - name: Publish to gh-pages
        working-directory: site
        run: |
          touch .nojekyll
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "carmelovarela"
          git config user.email "57266293+carmelovarela@users.noreply.github.com"
          git add -A
          git commit -q -m "Feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Weekly snapshot
        uses: actions/checkout@v4
        with:
          path: main
      - run: |
          week=$(date -u +%G-W%V)
          if [ ! -f "main/history/$week.json" ]; then
            mkdir -p main/history && cp site/feed.json "main/history/$week.json"
            cd main
            git config user.name "carmelovarela"
            git config user.email "57266293+carmelovarela@users.noreply.github.com"
            git add history && git commit -q -m "Snapshot $week" && git push -q
          fi

  # Waits for the next slot (:07, :22, :37, :52) and starts the next run. Runs even when the build
  # failed, so one bad run doesn't stop the feed. Only one waits at a time: a newer run (started
  # by hand, or the schedule if it ever fires) cancels the older waiting one, so there's never
  # more than one chain. A run started with GITHUB_TOKEN can't start others, except workflow_dispatch.
  next:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: feed-next
      cancel-in-progress: true
    permissions:
      actions: write
    steps:
      - name: Wait for the next slot
        run: |
          now=$(date -u +%s); m=$(( (now / 60) % 60 )); s=$(( now % 60 ))
          for slot in 7 22 37 52 67; do
            wait=$(( (slot - m) * 60 - s ))
            if [ $wait -ge 60 ]; then break; fi
          done
          echo "Next run in $wait s"; sleep $wait
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run feed --repo "${{ github.repository }}" --ref main && exit 0
            sleep 20
          done
          exit 1
